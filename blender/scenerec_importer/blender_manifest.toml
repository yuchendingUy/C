schema_version = "1.0.0"

id = "scenerec_importer"
version = "1.0.0"
name = "Scene Recorder Importer"
tagline = "Import Minecraft scene recordings made with Scene Recorder"
maintainer = "Scene Recorder"
type = "add-on"
tags = ["Import-Export", "Animation"]
blender_version_min = "4.4.0"
license = [
    "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Read recordings, write the USD frame cache next to them"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    ".*",
]
