<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1B19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小屋">
<title>小屋</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/fonts/wenkai/lxgwwenkaiscreen.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <svg class="login-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M17 30 L32 18 L47 30 V46 a2 2 0 0 1 -2 2 H19 a2 2 0 0 1 -2 -2 Z"/><rect x="28" y="35" width="8" height="13" rx="1.5"/></svg>
    <h1>小屋</h1>
    <label for="loginPass">请输入暗号</label>
    <input id="loginPass" name="password" type="password" autocomplete="current-password">
    <button class="btn btn-primary" type="submit">进入</button>
    <p class="login-err" id="loginErr" role="alert"></p>
  </form>
</section>

<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="side-head">
      <span class="brand">小屋</span>
      <button class="icon-btn" id="newPageBtn" type="button" title="新的一页" aria-label="新的一页">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <nav class="conv-list" id="convList" aria-label="聊天"></nav>
    <div class="side-foot">
      <button class="foot-btn" type="button" data-open="moments"><svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 3v9l6.5 6.2M12 12 5.6 18.3M12 12H3"/></svg>朋友圈<i class="foot-dot" id="momentDot" hidden></i></button>
      <button class="foot-btn" type="button" data-open="memory"><svg viewBox="0 0 24 24"><path d="M6 4h10a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2zM6 16h12M10 8h4"/></svg>回忆</button>
      <button class="foot-btn" type="button" data-open="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 4v6M8 14v6"/></svg>设置</button>
      <button class="foot-btn" type="button" id="musicBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 18a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM19 16a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/></svg><span>音乐</span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="chat">
    <header class="chat-head">
      <button class="icon-btn only-narrow" id="menuBtn" type="button" aria-label="打开目录">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <i class="menu-dot" id="menuDot" hidden></i>
      </button>
      <div class="head-title">
        <h2 id="convTitle"></h2>
        <span class="status" id="status"></span>
      </div>
      <button class="text-btn" id="compactBtn" type="button" title="把前面的聊天整理成一页日记">整理</button>
    </header>

    <div class="scroller" id="scroller">
      <div class="history" id="history"></div>
      <div class="live" id="live"></div>
    </div>
    <button class="jump" id="jumpBtn" type="button" hidden>回到最新</button>

    <form class="composer" id="composer">
      <div class="attachments" id="attachments"></div>
      <div class="composer-box">
        <label class="icon-btn attach" title="发图片">
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
          <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 15l4.5-4.5 4 4 2-2L20 18M15.5 9.5h.01"/></svg>
        </label>
        <textarea id="input" rows="1" placeholder="说点什么" enterkeyhint="send"></textarea>
        <button class="btn btn-primary send" id="sendBtn" type="submit">发送</button>
      </div>
    </form>
  </main>
</div>

<dialog id="sheet" class="sheet"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/music.js"></script>
<script src="/app.js"></script>
</body>
</html>
